<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>💬 RamzApp | الدردشات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222;
            --surface3: #2a2a2a;
            --text: #fff;
            --text2: #ddd;
            --text3: #999;
            --border: #2c2c2c;
            --accent: #ff0050;
            --accent2: #ff6b8a;
            --green: #00a884;
            --online: #00a884;
            --unread: #ff0050;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .light-theme {
            --bg: #f0f2f5;
            --surface: #fff;
            --surface2: #f5f5f5;
            --surface3: #e9edef;
            --text: #111;
            --text2: #333;
            --text3: #667781;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; }
        .screen {
            display: none; flex-direction: column; flex: 1; overflow-y: auto;
            position: absolute; inset: 0; bottom: 70px; background: var(--bg);
            z-index: 1; transition: opacity 0.2s;
        }
        .screen.active { display: flex; z-index: 2; }
        .screen.no-nav { bottom: 0; }

        .app-header {
            background: var(--surface); padding: 10px 16px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 56px;
            z-index: 20; gap: 8px; position: sticky; top: 0;
        }
        .app-header h2 { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
        .header-btn {
            background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .header-btn:hover { background: var(--surface3); }
        .header-btn:active { transform: scale(0.9); }

        .search-bar { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .search-bar input {
            width: 100%; padding: 10px 16px; border-radius: 25px; border: none;
            background: var(--surface3); color: var(--text); font-family: inherit;
            font-size: 14px; outline: none; transition: all var(--transition);
        }

        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            cursor: pointer; transition: all 0.15s; border-bottom: 1px solid var(--border);
        }
        .chat-item:hover { background: var(--surface2); }
        .chat-item:active { background: var(--surface3); }
        .chat-avatar {
            width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            font-weight: 700; flex-shrink: 0; position: relative; color: #fff;
        }
        .online-dot {
            position: absolute; bottom: 2px; right: 2px; width: 13px; height: 13px;
            background: var(--online); border-radius: 50%; border: 2px solid var(--surface);
        }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; }
        .chat-name { font-weight: 600; font-size: 15px; }
        .chat-time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
        .chat-preview { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
        .last-msg { font-size: 13px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .unread-badge {
            background: var(--unread); color: #fff; font-size: 11px; font-weight: 700;
            min-width: 20px; height: 20px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0;
        }

        /* شريط القصص */
        .story-bar {
            padding: 12px 14px; border-bottom: 1px solid var(--border);
            overflow-x: auto; white-space: nowrap; display: flex; gap: 12px; background: var(--surface);
        }
        .story-bar::-webkit-scrollbar { height: 0; }
        .story-item {
            display: inline-flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; min-width: 65px; transition: 0.2s;
        }
        .story-item:active { transform: scale(0.95); }
        .story-ring {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #ff0050, #ff7b00);
            display: flex; align-items: center; justify-content: center; padding: 3px;
        }
        .story-avatar {
            width: 52px; height: 52px; border-radius: 50%; background: var(--surface3);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; border: 2px solid var(--bg); color: var(--text); overflow: hidden;
        }
        .story-add .story-ring { background: var(--surface3); border: 2px dashed var(--accent); }
        .story-add span { font-size: 28px; color: var(--accent); }
        .story-name { font-size: 10px; color: var(--text3); max-width: 65px; overflow: hidden; text-overflow: ellipsis; }

        /* عارض القصص */
        .story-viewer {
            position: fixed; inset: 0; background: #000; z-index: 3500;
            display: none; flex-direction: column;
        }
        .story-viewer.active { display: flex; }
        .story-viewer-header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 3502;
            display: flex; align-items: center; gap: 10px; padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        .story-viewer-close {
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%; font-size: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .story-viewer-user { display: flex; align-items: center; gap: 8px; color: #fff; }
        .story-viewer-avatar {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .story-viewer-time { font-size: 11px; opacity: 0.8; }
        .story-progress-container {
            position: absolute; top: 8px; left: 16px; right: 16px;
            display: flex; gap: 4px; z-index: 3503;
        }
        .story-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .story-progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .story-content { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        .story-content img, .story-content video { max-width: 100%; max-height: 80vh; object-fit: contain; }
        .story-delete-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,0,0,0.6); border: none; color: #fff; padding: 8px 16px;
            border-radius: 20px; font-size: 12px; cursor: pointer; z-index: 3504;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
            display: flex; justify-content: space-around; padding: 6px 0 10px;
            border-top: 1px solid var(--border); z-index: 100; max-width: 600px; margin: 0 auto;
        }
        .nav-item {
            background: none; border: none; color: var(--text3); display: flex; flex-direction: column;
            align-items: center; gap: 3px; cursor: pointer; font-family: inherit; padding: 4px 8px;
            border-radius: 12px; transition: 0.2s; font-size: 10px; font-weight: 600; min-width: 55px;
        }
        .nav-item .nav-icon { font-size: 20px; }
        .nav-item.active { color: var(--accent); }

        .settings-list { padding: 16px; }
        .setting-item {
            display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
            background: var(--surface); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
            transition: 0.2s; border: 1px solid var(--border);
        }
        .setting-item:hover { background: var(--surface2); }
        .setting-left { display: flex; align-items: center; gap: 12px; }
        .setting-icon {
            width: 38px; height: 38px; background: var(--surface3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .toggle-sw {
            width: 48px; height: 26px; background: var(--border); border-radius: 13px;
            position: relative; cursor: pointer; transition: 0.3s;
        }
        .toggle-sw.active { background: var(--accent); }
        .toggle-sw::after {
            content: ''; position: absolute; width: 22px; height: 22px; background: #fff;
            border-radius: 50%; top: 2px; right: 2px; transition: 0.3s;
        }
        .toggle-sw.active::after { right: 24px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        .global-toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 20px; border-radius: 25px;
            font-size: 13px; z-index: 5000; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap; font-family: 'Cairo';
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <!-- شاشة الدردشات -->
    <div class="screen active" id="chatsScreen">
        <div class="app-header">
            <button class="header-btn" id="settingsBtn">⚙️</button>
            <h2>💬 Ramz-App</h2>
            <div class="header-actions">
                <button class="header-btn" id="contactsBtn">📇</button>
                <button class="header-btn" id="searchBtn">🔍</button>
            </div>
        </div>
        <div class="story-bar" id="storyBar" style="display:none;"></div>
        <div class="search-bar"><input type="text" id="searchChatsInput" placeholder="🔍 بحث في المحادثات..."></div>
        <div class="chats-list" id="chatsList"></div>
    </div>

    <!-- شاشة جهات الاتصال -->
    <div class="screen" id="contactsScreen">
        <div class="app-header">
            <button class="header-btn" id="backFromContactsBtn">⬅️</button>
            <h2>📇 جهات الاتصال</h2>
        </div>
        <div class="search-bar"><input type="text" id="searchContactsInput" placeholder="🔍 اسم أو رقم الهاتف..."></div>
        <div class="chats-list" id="contactsListContainer"></div>
    </div>

    <!-- شاشة الإعدادات -->
    <div class="screen no-nav" id="settingsScreen">
        <div class="app-header">
            <button class="header-btn" id="closeSettingsBtn">⬅️</button>
            <h2>⚙️ الإعدادات</h2>
        </div>
        <div class="settings-list">
            <div class="setting-item" id="themeToggle">
                <div class="setting-left"><div class="setting-icon">🌙</div><span>الوضع الليلي</span></div>
                <div class="toggle-sw active" id="themeSwitch"></div>
            </div>
            <div class="setting-item" id="notifToggle">
                <div class="setting-left"><div class="setting-icon">🔔</div><span>الإشعارات</span></div>
                <div class="toggle-sw active" id="notifSwitch"></div>
            </div>
            <div class="setting-item" onclick="window.logout()">
                <div class="setting-left"><div class="setting-icon">🚪</div><span>تسجيل الخروج</span></div>
            </div>
        </div>
    </div>

    <!-- عارض القصص -->
    <div class="story-viewer" id="storyViewer">
        <div class="story-progress-container" id="storyProgressContainer"></div>
        <div class="story-viewer-header">
            <button class="story-viewer-close" id="closeStoryViewer">✕</button>
            <div class="story-viewer-user">
                <div class="story-viewer-avatar" id="storyViewerAvatar">?</div>
                <div>
                    <div style="font-weight:600;" id="storyViewerName"></div>
                    <div class="story-viewer-time" id="storyViewerTime"></div>
                </div>
            </div>
        </div>
        <div class="story-content" id="storyContent"></div>
    </div>
    <input type="file" id="storyFileInput" style="display:none;" accept="image/*,video/*">
</div>

<!-- شريط التنقل السفلي -->
<div class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-nav="chats"><span class="nav-icon">💬</span><span>الدردشات</span></button>
    <button class="nav-item" data-nav="contacts"><span class="nav-icon">📇</span><span>جهات الاتصال</span></button>
    <button class="nav-item" data-nav="calls"><span class="nav-icon">📞</span><span>المكالمات</span></button>
    <button class="nav-item" data-nav="updates"><span class="nav-icon">🔄</span><span>التحديثات</span></button>
    <button class="nav-item" data-nav="tools"><span class="nav-icon">🛠️</span><span>الأدوات</span></button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://serlegwdzjulfcxabxzv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4_c97KxnG_7HTvfv-pKeNQ_FTlnK6Yx';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentScreen = 'chats';
let currentStoryGroups = [];
let currentStoryGroupIndex = 0;
let currentStoryIndex = 0;
let storyInterval = null;

function toast(msg) {
    const existing = document.querySelector('.global-toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'global-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.style.opacity = '1');
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2000);
}

function timeAgo(d) {
    if (!d) return '';
    const df = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (df < 60) return 'الآن';
    if (df < 3600) return Math.floor(df / 60) + ' د';
    if (df < 86400) return Math.floor(df / 3600) + ' س';
    return Math.floor(df / 86400) + ' يوم';
}

function esc(s) { return s ? s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]) : ''; }

async function getCurrentUser() {
    const raw = localStorage.getItem('ramzapp_user');
    if (!raw) { window.location.href = 'login.html'; return null; }
    try { return JSON.parse(raw); } catch (e) { return null; }
}

// الثيم
function loadTheme() {
    const theme = localStorage.getItem('ramzapp_theme') || 'dark';
    if (theme === 'light') document.body.classList.add('light-theme');
    const ts = document.getElementById('themeSwitch');
    if (ts) ts.classList.toggle('active', theme === 'dark');
}
function toggleTheme() {
    const isLight = document.body.classList.toggle('light-theme');
    localStorage.setItem('ramzapp_theme', isLight ? 'light' : 'dark');
    const ts = document.getElementById('themeSwitch');
    if (ts) ts.classList.toggle('active', !isLight);
    toast(isLight ? '☀️ الوضع النهاري' : '🌙 الوضع الليلي');
}
loadTheme();

// التنقل
function showScreen(name) {
    currentScreen = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(name + 'Screen');
    if (target) target.classList.add('active');
    const noNav = name === 'settings';
    document.getElementById('bottomNav').style.display = noNav ? 'none' : 'flex';
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
    if (name === 'chats') renderChats();
    if (name === 'contacts') renderContacts();
}

document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.nav)));
document.getElementById('settingsBtn').addEventListener('click', () => showScreen('settings'));
document.getElementById('closeSettingsBtn').addEventListener('click', () => showScreen('chats'));
document.getElementById('contactsBtn').addEventListener('click', () => showScreen('contacts'));
document.getElementById('backFromContactsBtn').addEventListener('click', () => showScreen('chats'));

// شاشة الدردشات
async function renderChats(filter = '') {
    const container = document.getElementById('chatsList');
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3);">⏳ جاري التحميل...</div>';
    try {
        const user = await getCurrentUser();
        if (!user) return;
        const { data: users, error } = await supabase.from('users').select('*').neq('id', user.id);
        if (error) throw error;
        let chats = users.map(u => ({
            id: u.id, name: u.name || 'مستخدم', avatar: u.avatar || '?',
            online: u.is_online, lastMsg: '', lastTime: u.last_seen, unread: 0
        }));
        if (filter) {
            const q = filter.toLowerCase();
            chats = chats.filter(c => c.name.toLowerCase().includes(q));
        }
        if (chats.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><p>لا توجد محادثات</p></div>';
            return;
        }
        container.innerHTML = '';
        chats.forEach(c => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="chat-avatar">${c.avatar}${c.online ? '<span class="online-dot"></span>' : ''}</div>
                <div class="chat-info">
                    <div class="chat-name-row"><span class="chat-name">${esc(c.name)}</span><span class="chat-time">${c.lastTime ? timeAgo(c.lastTime) : ''}</span></div>
                    <div class="chat-preview"><span class="last-msg">${c.lastMsg || '👋 ابدأ المحادثة'}</span>${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}</div>
                </div>`;
            div.addEventListener('click', () => {
                localStorage.setItem('currentChatId', c.id);
                window.location.href = 'chat.html';
            });
            container.appendChild(div);
        });
    } catch (err) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>تعذر التحميل</p></div>';
    }
}

document.getElementById('searchChatsInput').addEventListener('input', (e) => renderChats(e.target.value));
document.getElementById('searchBtn').addEventListener('click', () => {
    document.getElementById('searchChatsInput').focus();
    showScreen('chats');
});

// شاشة جهات الاتصال
async function renderContacts(filter = '') {
    const container = document.getElementById('contactsListContainer');
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3);">⏳ جاري التحميل...</div>';
    try {
        const user = await getCurrentUser();
        if (!user) return;
        const { data: users, error } = await supabase.from('users').select('*').neq('id', user.id);
        if (error) throw error;
        let contacts = users.map(u => ({
            id: u.id, name: u.name || 'مستخدم', avatar: u.avatar || '?', phone: u.phone || '', online: u.is_online
        }));
        if (filter) {
            const q = filter.toLowerCase();
            contacts = contacts.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));
        }
        if (contacts.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">📇</div><p>لا توجد جهات اتصال</p></div>';
            return;
        }
        container.innerHTML = '';
        contacts.forEach(c => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="chat-avatar">${c.avatar}${c.online ? '<span class="online-dot"></span>' : ''}</div>
                <div class="chat-info">
                    <div class="chat-name-row"><span class="chat-name">${esc(c.name)}</span></div>
                    <div class="last-msg">${c.phone}</div>
                </div>
                <button class="header-btn" style="color:var(--accent);">💬</button>`;
            div.addEventListener('click', () => {
                localStorage.setItem('currentChatId', c.id);
                window.location.href = 'chat.html';
            });
            container.appendChild(div);
        });
    } catch (err) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>تعذر التحميل</p></div>';
    }
}

document.getElementById('searchContactsInput').addEventListener('input', (e) => renderContacts(e.target.value));

// القصص (بسيطة)
async function renderStoryBar() {
    const bar = document.getElementById('storyBar');
    try {
        const user = await getCurrentUser();
        if (!user) return;
        const { data: stories } = await supabase.from('stories').select('*, users(id, name, avatar)').neq('user_id', user.id).order('created_at', { ascending: false });
        if (!stories || stories.length === 0) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        bar.innerHTML = `<div class="story-item story-add" id="addStoryBtn"><div class="story-ring"><span>+</span></div><div class="story-name">إضافة</div></div>` +
            stories.map((s, i) => `
                <div class="story-item" data-group="${i}">
                    <div class="story-ring"><div class="story-avatar">${s.users.avatar || '?'}</div></div>
                    <div class="story-name">${esc(s.users.name)}</div>
                </div>
            `).join('');
        document.getElementById('addStoryBtn').addEventListener('click', () => document.getElementById('storyFileInput').click());
        bar.querySelectorAll('.story-item[data-group]').forEach(item => {
            item.addEventListener('click', () => openStoryViewer(parseInt(item.dataset.group), stories));
        });
        currentStoryGroups = stories;
    } catch (e) { bar.style.display = 'none'; }
}

document.getElementById('storyFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
        const user = await getCurrentUser();
        if (!user) return;
        const fileName = `stories/${user.id}/${Date.now()}-${file.name}`;
        await supabase.storage.from('ramz-images').upload(fileName, file);
        const { data: publicURL } = supabase.storage.from('ramz-images').getPublicUrl(fileName);
        await supabase.from('stories').insert({ user_id: user.id, media_url: publicURL.publicUrl, type: file.type.startsWith('video/') ? 'video' : 'image' });
        toast('✅ تم نشر القصة');
        renderStoryBar();
    } catch (err) { toast('❌ فشل رفع القصة'); }
    e.target.value = '';
});

function openStoryViewer(groupIdx, stories) {
    currentStoryGroupIndex = groupIdx;
    currentStoryIndex = 0;
    renderCurrentStory(stories);
    document.getElementById('storyViewer').classList.add('active');
}

function closeStoryViewer() {
    clearInterval(storyInterval);
    document.getElementById('storyViewer').classList.remove('active');
    document.getElementById('storyContent').innerHTML = '';
}

document.getElementById('closeStoryViewer').addEventListener('click', closeStoryViewer);

function renderCurrentStory(stories) {
    clearInterval(storyInterval);
    const story = stories[currentStoryGroupIndex];
    if (!story) { closeStoryViewer(); return; }
    document.getElementById('storyViewerAvatar').textContent = story.users.avatar || '?';
    document.getElementById('storyViewerName').textContent = story.users.name;
    document.getElementById('storyViewerTime').textContent = timeAgo(story.created_at);
    document.getElementById('storyContent').innerHTML = story.type === 'video' ?
        `<video src="${story.media_url}" autoplay muted playsinline style="max-width:100%;max-height:80vh;"></video>` :
        `<img src="${story.media_url}" alt="قصة">`;
    let progress = 0;
    storyInterval = setInterval(() => {
        progress += 2;
        if (progress >= 100) { clearInterval(storyInterval); closeStoryViewer(); }
    }, 50);
}

// الإعدادات
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('notifToggle').addEventListener('click', function() {
    const ns = document.getElementById('notifSwitch');
    const isActive = !ns.classList.contains('active');
    ns.classList.toggle('active', isActive);
    localStorage.setItem('ramzapp_notifications', isActive);
    toast(isActive ? '🔔 الإشعارات مفعلة' : '🔕 الإشعارات معطلة');
});

window.logout = () => {
    localStorage.removeItem('ramzapp_user');
    window.location.href = 'login.html';
};

// بدء التشغيل
(async () => {
    const user = await getCurrentUser();
    if (!user) return;
    await renderChats();
    renderStoryBar();
    setInterval(() => { if (currentScreen === 'chats') renderChats(); }, 10000);
})();
</script>
