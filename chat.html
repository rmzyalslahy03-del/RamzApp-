<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>RamzApp | محادثة</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface2: #f5f7f9;
            --surface3: #e9edef;
            --text: #111111;
            --text2: #333333;
            --text3: #667781;
            --border: #e0e0e0;
            --accent: #25D366;
            --accent2: #128C7E;
            --green: #25D366;
            --blue-check: #34b7f1;
            --online: #4caf50;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Inter', 'Cairo', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
        }
        .chat-header {
            background: var(--surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: clamp(8px, 3vw, 12px);
            border-bottom: 1px solid var(--border);
            min-height: 56px;
            z-index: 20;
        }
        .back-btn, .header-btn {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover, .header-btn:hover { background: var(--surface3); color: var(--text); }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
            cursor: pointer;
            color: #fff;
        }
        .chat-info { flex: 1; min-width: 0; cursor: pointer; }
        .chat-name { font-weight: 600; font-size: clamp(14px, 4vw, 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .chat-status { font-size: clamp(10px, 3vw, 12px); color: var(--text3); }
        .chat-status.online { color: var(--online); }
        .chat-status.typing { color: var(--green); }
        .typing-dots { display: inline-flex; gap: 3px; margin-right: 4px; }
        .typing-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--green); animation: typeBounce 1.4s infinite; }
        @keyframes typeBounce { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
        .online-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--online); display: inline-block; margin-left: 4px; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg);
            scroll-behavior: smooth;
        }
        .date-divider {
            text-align: center;
            margin: 8px 0;
            font-size: 10px;
            color: var(--text3);
            background: var(--surface2);
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            align-self: center;
        }
        .msg-row { display: flex; width: 100%; animation: fadeInUp 0.25s ease; }
        .msg-row.own { justify-content: flex-end; }
        .msg-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: clamp(12px, 3.5vw, 14px);
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }
        .own .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .other .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .attachment-img { max-width: 180px; max-height: 180px; border-radius: 14px; margin: 4px 0; cursor: pointer; }
        .msg-time-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 9px;
            opacity: 0.7;
        }
        .msg-actions { display: flex; gap: 5px; margin-top: 5px; opacity: 0; transition: opacity 0.2s; }
        .msg-bubble:hover .msg-actions { opacity: 1; }
        .msg-actions button { background: rgba(0,0,0,0.05); border: none; color: var(--text); font-size: 10px; cursor: pointer; padding: 2px 6px; border-radius: 20px; }
        .input-bar {
            background: var(--surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border);
        }
        .input-bar input {
            flex: 1;
            background: var(--surface3);
            border: none;
            border-radius: 25px;
            padding: 10px 14px;
            color: var(--text);
            font-size: clamp(13px, 4vw, 15px);
            outline: none;
        }
        .input-btn {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 20px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .input-btn:hover { background: var(--surface3); color: var(--text); }
        .send-btn { background: var(--accent) !important; color: #fff !important; }
        .mic-btn.recording { color: #ff4d4d !important; animation: pulseMic 1s infinite; }
        @keyframes pulseMic { 0%,100% { text-shadow: 0 0 0 rgba(255,77,77,0); } 50% { text-shadow: 0 0 8px #ff4d4d; } }
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            right: 10px;
            background: var(--surface);
            border-radius: 20px;
            padding: 8px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            flex-wrap: wrap;
            gap: 5px;
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .emoji-picker.show { display: flex; }
        .emoji-picker span { font-size: 24px; cursor: pointer; padding: 4px; border-radius: 8px; }
        .chat-search-bar {
            padding: 8px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: none;
            align-items: center;
            gap: 8px;
        }
        .chat-search-bar input { flex: 1; padding: 8px 14px; border-radius: 25px; border: none; background: var(--surface3); color: var(--text); font-size: 13px; outline: none; }
        .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .image-viewer.active { display: flex; }
        .image-viewer-header { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px; z-index: 3001; }
        .image-viewer-back-btn, .image-viewer-menu-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .image-viewer-dropdown { position: absolute; top: 55px; left: 10px; background: rgba(30,30,40,0.96); border-radius: 16px; min-width: 180px; overflow: hidden; display: none; flex-direction: column; }
        .image-viewer-dropdown.show { display: flex; }
        .image-viewer img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--surface); border-radius: 28px; width: 320px; max-width: 90%; text-align: center; animation: popIn 0.3s ease; }
        .modal-avatar { width: 90px; height: 90px; border-radius: 50%; margin: 20px auto 10px; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 36px; background: var(--surface3); color: var(--text); }
        .modal-name { font-size: 18px; font-weight: 700; color: var(--text); }
        .modal-bio { font-size: 11px; color: var(--text3); margin-bottom: 16px; }
        .modal-actions { display: grid; grid-template-columns: repeat(2,1fr); gap: 2px; padding: 10px; background: var(--surface2); }
        .modal-action { background: none; border: none; padding: 8px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; color: var(--text); }
        .modal-close { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.5); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
        .dropdown-menu, .sub-dropdown-menu {
            position: fixed;
            top: 56px;
            left: 8px;
            background: var(--surface);
            border-radius: 14px;
            width: 210px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            z-index: 9999;
            display: none;
            overflow: hidden;
        }
        .dropdown-menu.show { display: block; }
        .sub-dropdown-menu.show { display: block; }
        .dropdown-item, .sub-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: background 0.15s;
            color: var(--text2);
            font-size: 12.5px;
            border-bottom: 1px solid var(--border);
        }
        .dropdown-item:last-child, .sub-dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover, .sub-dropdown-item:hover { background: var(--surface3); }
        .dropdown-item i, .sub-dropdown-item i { width: 18px; font-size: 14px; color: var(--text3); }
        .dropdown-item.danger, .sub-dropdown-item.danger { color: #ff5e5e; }
        .more-btn { background: var(--surface2); border-top: 1px solid var(--border); margin-top: 4px; }
        .call-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .call-modal.show { display: flex; }
        .caller-info { text-align: center; color: white; }
        .caller-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 12px;
        }
        .caller-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: white; }
        .call-status { font-size: 14px; opacity: 0.8; }
        .call-actions { display: flex; gap: 40px; margin-top: 20px; }
        .call-action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ff4d4d;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }
        .call-action-btn.answer { background: #25D366; }
        .call-timer { font-size: 32px; font-family: monospace; color: white; }
        .remote-video-container, .local-video-container {
            position: relative;
            margin: 10px;
        }
        .local-video-container video {
            width: 120px;
            position: absolute;
            bottom: 10px;
            right: 10px;
            border-radius: 12px;
            border: 2px solid white;
        }
        .global-toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--surface2); color: var(--text); padding: 6px 16px; border-radius: 30px;
            font-size: 12px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            border: 1px solid var(--border);
            white-space: nowrap;
        }
    </style>
</head>
<body>

</div>
<div class="messages-area" id="messagesArea"></div>
<div class="input-bar">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://serlegwdzjulfcxabxzv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4_c97KxnG_7HTvfv-pKeNQ_FTlnK6Yx';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const currentChatId = localStorage.getItem('currentChatId');
if (!currentChatId) window.location.href = 'chats.html';

let user = null;
let isRecording = false;
let mediaRecorder = null;
let recordingChunks = [];
let currentViewerImageUrl = '';
let rotationAngle = 0;
let replyTarget = null;
let pendingImg = null;
let typingChannel = null;
let msgChannel = null;
let callsChannel = null;
let currentCallId = null;
let callTimerInterval = null;
let ringtoneAudio = null;
let callTimeoutId = null;
let isMuted = localStorage.getItem(`muted_${currentChatId}`) === 'true';
let isBlocked = localStorage.getItem(`blocked_${currentChatId}`) === 'true';
let isVideoCall = false;
let localStream = null;
let remoteStream = null;
let peer = null;
let currentCall = null;

function toast(msg) {
    let el = document.querySelector('.global-toast');
    if (el) el.remove();
    el = document.createElement('div');
    el.className = 'global-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.style.opacity = '1');
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2000);
}

function timeAgo(d) {
    if (!d) return '';
    const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (s < 60) return 'الآن';
    if (s < 3600) return Math.floor(s/60)+' د';
    if (s < 86400) return Math.floor(s/3600)+' س';
    return Math.floor(s/86400)+' يوم';
}
function fmtTime(d) { return new Date(d).toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' }); }
function fmtDate(d) { return new Date(d).toLocaleDateString('ar-SA', { weekday:'long', month:'long', day:'numeric' }); }
function esc(s) { return s ? s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]) : ''; }

async function getCurrentUser() {
    const raw = localStorage.getItem('ramzapp_user');
    if (!raw) { window.location.href = 'login.html'; return null; }
    return JSON.parse(raw);
}

async function sendMessage(text, mediaUrl='', type='text') {
    if (isBlocked) { toast('🚫 لا يمكنك إرسال رسائل، هذا المستخدم محظور'); return null; }
    const { data, error } = await supabase.from('messages').insert({
        sender_id: user.id, receiver_id: currentChatId,
        content: text, type, media_url: mediaUrl, reply_to: replyTarget?.id || null, status: 'sent'
    }).select().single();
    if (error) { toast('فشل الإرسال'); return null; }
    return data;
}
async function fetchMessages() {
    const { data } = await supabase.from('messages').select('*')
        .or(`and(sender_id.eq.${user.id},receiver_id.eq.${currentChatId}),and(sender_id.eq.${currentChatId},receiver_id.eq.${user.id})`)
        .order('created_at', { ascending: true });
    return data || [];
}
function subscribeToMessages() {
    return supabase.channel('msgs-'+currentChatId)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`receiver_id=eq.${user.id}` },
            payload => { if(payload.new.sender_id === currentChatId) { appendMessage(payload.new); supabase.from('messages').update({ status:'delivered' }).eq('id',payload.new.id); } })
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages' }, payload => {
            const updated = payload.new;
            const msgDiv = document.querySelector(`.msg-row.own .msg-bubble[data-id="${updated.id}"]`);
            if (msgDiv) {
                const statusSpan = msgDiv.querySelector('.msg-time-row .msg-status');

function appendMessage(msg, scroll=true) {

    const div = document.createElement('div');
    div.className = 'msg-row ' + (isMe ? 'own' : 'other');

    if (isMe) {
        if (msg.status === 'read') stIcon = '<span class="msg-status"><i class="fas fa-check-double" style="color:#34b7f1;"></i></span>';
        else if (msg.status === 'delivered') stIcon = '<span class="msg-status"><i class="fas fa-check-double"></i></span>';
        else stIcon = '<span class="msg-status"><i class="fas fa-check"></i></span>';
    } else if (msg.type === 'missed_call') {
        stIcon = '<i class="fas fa-phone-slash" style="color:#ff4d4d;"></i>';
    }
    let mediaContent = '';

        mediaContent = `<div><img src="${msg.media_url}" class="attachment-img" onclick="openImageViewer('${msg.media_url}')" loading="lazy"></div>`;
    } else if (msg.type === 'voice' && msg.media_url) {

    } else if (msg.type === 'missed_call') {
        mediaContent = `<div><i class="fas fa-phone-slash"></i> مكالمة فائتة من ${msg.content}</div>`;
        msg.content = '';
    }
    div.innerHTML = `
        <div class="msg-bubble">
            ${msg.reply_to ? `<div class="reply-preview" onclick="document.getElementById('msg-${msg.reply_to}')?.scrollIntoView({behavior:'smooth',block:'center'})"><i class="fas fa-reply"></i> رد</div>` : ''}
            ${mediaContent}

            <div class="msg-actions">

async function initPeer() {
    return new Promise((resolve, reject) => {
        peer = new Peer(user.id, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        peer.on('open', (id) => {
            console.log('PeerJS ready, ID:', id);
            supabase.from('users').update({ peer_id: id }).eq('id', user.id).then();
            resolve(peer);
        });
        peer.on('error', (err) => { console.error('PeerJS error:', err); reject(err); });
    });
}
async function getPeerId(userId) {
    const { data, error } = await supabase.from('users').select('peer_id').eq('id', userId).single();
    if (error || !data?.peer_id) return null;
    return data.peer_id;
}
function setupCallHandlers(call) {
    call.on('stream', (stream) => {
        remoteStream = stream;
        document.getElementById('remoteVideo').srcObject = stream;
        document.getElementById('ongoingCallModal').classList.add('show');
        document.getElementById('callTimer').style.display = 'block';
        supabase.from('calls').update({ status: 'ongoing', answered_at: new Date().toISOString() }).eq('id', currentCallId);
        startTimer();
    });
    call.on('close', () => { endCall(); });
    call.on('error', (err) => { console.error(err); endCall(); });
}
async function startCall(isVideo) {
    if (currentCallId) return;
    isVideoCall = isVideo;
    try {
        const stream = await navigator.mediaDevices.getUserMedia(isVideo ? { audio: true, video: true } : { audio: true, video: false });
        localStream = stream;
        const remotePeerId = await getPeerId(currentChatId);
        if (!remotePeerId) { toast('المستخدم غير متاح للمكالمة'); return; }
        const call = peer.call(remotePeerId, stream);
        currentCall = call;
        setupCallHandlers(call);
        const { data: callRecord, error } = await supabase
            .from('calls')
            .insert({
                caller_id: user.id,
                callee_id: currentChatId,
                status: 'ringing',
                created_at: new Date().toISOString(),
                peer_id: remotePeerId,
                type: isVideo ? 'video' : 'audio'
            })
            .select().single();
        if (error) throw error;
        currentCallId = callRecord.id;
        showOngoingCallUI(true);
        playRingtone('waiting');
    } catch (err) { toast('فشل بدء المكالمة: ' + err.message); }
}
async function addMissedCallMessage(callerName) {
    await supabase.from('messages').insert({
        sender_id: currentChatId,
        receiver_id: user.id,
        content: callerName || 'مستخدم',
        type: 'missed_call',
        media_url: '',
        status: 'sent',
        created_at: new Date().toISOString()
    });
    toast('📞 مكالمة فائتة من ' + (callerName || 'المستخدم'));
}
async function answerIncomingCall(isVideoAnswer) {
    if (!currentCallId) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia(isVideoAnswer ? { audio: true, video: true } : { audio: true, video: false });
        localStream = stream;
        if (currentCall) currentCall.answer(stream);
        await supabase.from('calls').update({ status: 'ongoing', answered_at: new Date().toISOString() }).eq('id', currentCallId);
        document.getElementById('incomingCallModal').classList.remove('show');
        showOngoingCallUI(isVideoAnswer);
        startTimer();
        if (ringtoneAudio) ringtoneAudio.stop();
        if (callTimeoutId) clearTimeout(callTimeoutId);
    } catch (err) { toast('فشل قبول المكالمة: ' + err.message); }
}
async function endCall() {
    if (currentCall) currentCall.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    if (remoteStream) remoteStream.getTracks().forEach(track => track.stop());
    if (callTimerInterval) clearInterval(callTimerInterval);
    document.getElementById('ongoingCallModal').classList.remove('show');
    document.getElementById('incomingCallModal').classList.remove('show');
    if (currentCallId) {
        await supabase.from('calls').update({ status: 'completed', ended_at: new Date().toISOString() }).eq('id', currentCallId);
        currentCallId = null;
    }
    toast('انتهت المكالمة');
}
function showOngoingCallUI(isVideo) {
    const modal = document.getElementById('ongoingCallModal');
    const remoteVideoDiv = document.getElementById('remoteVideoContainer');
    const localVideoDiv = document.getElementById('localVideoContainer');
    if (isVideo) {
        remoteVideoDiv.style.display = 'block';
        localVideoDiv.style.display = 'block';
        if (localStream) {
            const localVideoEl = document.getElementById('localVideo');
            localVideoEl.srcObject = localStream;
        }
    } else {
        remoteVideoDiv.style.display = 'none';
        localVideoDiv.style.display = 'none';
    }
    modal.classList.add('show');
}
function startTimer() {
    let startTime = Date.now();
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
        let diff = Math.floor((Date.now() - startTime) / 1000);
        let mins = Math.floor(diff / 60);
        let secs = diff % 60;
        document.getElementById('callTimer').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }, 1000);
}
function playRingtone(type = 'incoming') {
    if (ringtoneAudio) ringtoneAudio.stop();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.value = 440;
    gain.gain.value = 0.3;
    oscillator.start();
    let interval = setInterval(() => {
        if (!ringtoneAudio) {
            clearInterval(interval);
            oscillator.stop();
            audioCtx.close();
            return;
        }
        gain.gain.value = gain.gain.value === 0.3 ? 0 : 0.3;
    }, type === 'waiting' ? 2000 : 500);
    ringtoneAudio = { stop: () => { clearInterval(interval); oscillator.stop(); audioCtx.close(); ringtoneAudio = null; } };
}
function subscribeToCalls() {
    if (callsChannel) return;
    callsChannel = supabase
        .channel('calls-'+user.id)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'calls', filter:`callee_id=eq.${user.id}` }, async (payload) => {
            const newCall = payload.new;
            if (newCall.status === 'ringing' && !currentCallId) {
                currentCallId = newCall.id;
                const { data: caller } = await supabase.from('users').select('name, avatar').eq('id', newCall.caller_id).single();
                document.getElementById('callerName').textContent = caller?.name || 'مستخدم';
                document.getElementById('callerAvatar').textContent = caller?.avatar || '?';
                document.getElementById('answerVideoCallBtn').style.display = newCall.type === 'video' ? 'flex' : 'none';
                document.getElementById('incomingCallModal').classList.add('show');
                playRingtone('incoming');
                if (peer && newCall.peer_id) {
                    const call = peer.call(newCall.peer_id, null);
                    currentCall = call;
                    setupCallHandlers(call);
                }
                if (callTimeoutId) clearTimeout(callTimeoutId);
                callTimeoutId = setTimeout(async () => {
                    if (currentCallId && document.getElementById('incomingCallModal').classList.contains('show')) {
                        await supabase.from('calls').update({ status: 'missed', ended_at: new Date().toISOString() }).eq('id', currentCallId);
                        const { data: callData } = await supabase.from('calls').select('caller_id, users!caller_id(name)').eq('id', currentCallId).single();
                        if (callData) await addMissedCallMessage(callData.users?.name || 'مستخدم');
                        document.getElementById('incomingCallModal').classList.remove('show');
                        if (ringtoneAudio) ringtoneAudio.stop();
                        currentCallId = null;
                    }
                }, 30000);
            }
        })
        .subscribe();
}

let micBtn = document.getElementById('micBtn');
micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);

async function startRecording(e) {
    e.preventDefault();
    if (isRecording) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isRecording = true;
        micBtn.classList.add('recording');
        toast('🎙️ سجل... ارفع إصبعك للإرسال');
        mediaRecorder = new MediaRecorder(stream);
        recordingChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordingChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordingChunks, { type: 'audio/webm' });
            const fileName = `voices/${user.id}/${Date.now()}.webm`;
            const { error } = await supabase.storage.from('ramz-images').upload(fileName, blob);
            if (error) toast('❌ فشل رفع التسجيل');
            else {
                const { data: publicURL } = supabase.storage.from('ramz-images').getPublicUrl(fileName);
                const msg = await sendMessage('🎤 رسالة صوتية', publicURL.publicUrl, 'voice');
                if (msg) appendMessage(msg);
                toast('✅ تم إرسال التسجيل');
            }
            stream.getTracks().forEach(t => t.stop());
            micBtn.classList.remove('recording');
            isRecording = false;
        };
        mediaRecorder.start();
    } catch(err) { toast('⚠️ لا يمكن الوصول للميكروفون'); isRecording=false; micBtn.classList.remove('recording'); }
}
function stopRecording() { if (isRecording && mediaRecorder?.state === 'recording') mediaRecorder.stop(); }

// إيموجي
const emojis = ['😀','😂','😍','😢','😡','👍','❤️','🔥','🎉','😎','🤔','😴','🥳','😇','🤗','😤','😱','💔','✨','🌟','💡','📎','📷','🎵','📍','🙏','💪','👀','🤝','🚀','💯','✅','❌','🎯'];
let picker = document.getElementById('emojiPicker');
emojis.forEach(e => { let sp = document.createElement('span'); sp.textContent=e; sp.addEventListener('click',()=>{ document.getElementById('msgInput').value+=e; picker.classList.remove('show'); document.getElementById('msgInput').focus(); updateSendBtn(); }); picker.appendChild(sp); });
document.getElementById('emojiBtn').addEventListener('click', e => { e.stopPropagation(); picker.classList.toggle('show'); });
document.addEventListener('click', e => { if(!picker.contains(e.target) && e.target !== document.getElementById('emojiBtn')) picker.classList.remove('show'); });

// مرفقات
document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('hiddenFileInput').click());
document.getElementById('hiddenFileInput').addEventListener('change', async (e) => {
    let file = e.target.files[0]; if(!file) return;
    try { toast('رفع الصورة...'); let url = await uploadFile(file); pendingImg = url; updateSendBtn(); toast('الصورة جاهزة للإرسال'); } catch(err) { toast('فشل رفع الصورة'); }
    e.target.value = '';
});

// رجوع
document.getElementById('backBtn').addEventListener('click', () => { localStorage.removeItem('currentChatId'); window.location.href='chats.html'; });

// ========== القوائم المنبثقة ==========
const mainMenu = document.getElementById('chatMenu');
const subMenu = document.getElementById('subMenu');
const menuBtn = document.getElementById('chatMenuBtn');
menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    mainMenu.classList.toggle('show');
    subMenu.classList.remove('show');
});
document.querySelector('[data-action="more"]').addEventListener('click', (e) => {
    e.stopPropagation();
    subMenu.classList.toggle('show');
});
const mainActions = {
    view_contact: () => openContactProfile(),
    search: () => { document.getElementById('chatSearchBar').style.display='flex'; document.getElementById('chatSearchInput').focus(); },
    media: () => mediaLinks(),
    mute: () => toggleMute(),
    disappear: () => disappearMessages(),
    new_group: () => newGroup(),
    chat_theme: () => chatTheme()
};
document.querySelectorAll('#chatMenu .dropdown-item[data-action]').forEach(item => {
    const action = item.dataset.action;
    if (action !== 'more' && mainActions[action]) {
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            mainMenu.classList.remove('show');
            mainActions[action]();
        });
    }
});
const subActions = {
    report: () => reportUser(),
    block: () => toggleBlock(),
    clear_chat: () => clearChat(),
    transfer_chat: () => transferChat(),
    add_shortcut: () => addShortcut()
};
document.querySelectorAll('#subMenu .sub-dropdown-item').forEach(item => {
    const action = item.dataset.action;
    if (subActions[action]) {
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            subMenu.classList.remove('show');
            mainMenu.classList.remove('show');
            subActions[action]();
        });
    }
});
document.addEventListener('click', (e) => {
    if (!menuBtn.contains(e.target) && !mainMenu.contains(e.target) && !subMenu.contains(e.target)) {
        mainMenu.classList.remove('show');
        subMenu.classList.remove('show');
    }
});

// ========== بدء التشغيل ==========
async function loadMessages() {
    const msgs = await fetchMessages();
    document.getElementById('messagesArea').innerHTML = '';
    let lastDate = '';
    msgs.forEach(m => {
        let md = new Date(m.created_at).toDateString();
        if (md !== lastDate) {
            lastDate = md;
            document.getElementById('messagesArea').innerHTML += `<div class="date-divider">${fmtDate(m.created_at)}</div>`;
        }
        appendMessage(m, false);
    });
    document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
    // تحديث جميع الرسائل المستلمة إلى "read"
    const unread = msgs.filter(m => m.receiver_id === user.id && m.status !== 'read').map(m => m.id);
    if (unread.length) {
        await supabase.from('messages').update({ status: 'read' }).in('id', unread);
    }
}
(async () => {
    user = await getCurrentUser();
    if (!user) return;
    await supabase.from('users').update({ is_online: true, last_seen: new Date().toISOString() }).eq('id', user.id);
    window.addEventListener('beforeunload', () => {
        supabase.from('users').update({ is_online: false, last_seen: new Date().toISOString() }).eq('id', user.id);
        if (msgChannel) supabase.removeChannel(msgChannel);
        if (typingChannel) supabase.removeChannel(typingChannel);
        if (callsChannel) supabase.removeChannel(callsChannel);
        if (peer) peer.destroy();
    });
    let { data: chatUser } = await supabase.from('users').select('*').eq('id', currentChatId).single();
    if (!chatUser) { window.location.href = 'chats.html'; return; }
    document.getElementById('chatNameDisp').textContent = chatUser.name;
    document.getElementById('chatAvatar').textContent = chatUser.avatar || '?';
    let st = document.getElementById('chatStatusDisp');
    if (chatUser.is_online) { st.innerHTML = 'متصل الآن <span class="online-indicator"></span>'; st.className = 'chat-status online'; }
    else { st.textContent = 'آخر ظهور ' + timeAgo(chatUser.last_seen); st.className = 'chat-status'; }
    let customNames = JSON.parse(localStorage.getItem('ramzapp_contact_names') || '{}');
    if (customNames[currentChatId]) document.getElementById('chatNameDisp').textContent = customNames[currentChatId];
    await loadMessages();
    msgChannel = subscribeToMessages();
    await initPeer();
    subscribeToCalls();
    let typingTimer;
    document.getElementById('msgInput').addEventListener('input', () => {
        supabase.channel('typing-'+currentChatId).send({ type:'broadcast', event:'typing', payload:{ user_id: user.id, isTyping: true } });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            supabase.channel('typing-'+currentChatId).send({ type:'broadcast', event:'typing', payload:{ user_id: user.id, isTyping: false } });
        }, 2000);
    });
    typingChannel = supabase.channel('typing-'+user.id);
    typingChannel.on('broadcast', { event:'typing' }, (payload) => {
        if (payload.user_id === currentChatId) {
            let st = document.getElementById('chatStatusDisp');
            if (payload.isTyping) st.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> يكتب الآن...';
            else st.innerHTML = chatUser.is_online ? 'متصل الآن <span class="online-indicator"></span>' : 'آخر ظهور ' + timeAgo(chatUser.last_seen);
        }
    }).subscribe();
    updateSendBtn();
})();
</script>
</body>
